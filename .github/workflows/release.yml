# Publishes to npm when a version tag is pushed, authenticating through npm's
# trusted publishing (GitHub OIDC), so no registry token is stored in the repo.
# A tag whose version is already on the registry is a no-op, so re-pushing is safe.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 20 ships an older npm.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version"
            exit 1
          fi

      - name: Skip when this version is already on the registry
        id: registry
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public
